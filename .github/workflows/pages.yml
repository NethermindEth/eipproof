name: pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_fallback:
        description: Skip the live build and deploy from the committed snapshot
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://nethermindeth.github.io/eipproof
  FALLBACK_ISSUE: "pages: live build falls back to snapshot"

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - id: sha
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -n "$CI_SHA" ] && [ "$CI_SHA" != "$head" ]; then
            echo "::error::main moved from $CI_SHA to $head; the ci run for $head deploys it"
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"
      - run: make test
      - id: live
        if: ${{ !inputs.force_fallback }}
        continue-on-error: true
        run: make build ARGS="--prev-site $SITE_URL --fallback"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.live.outcome != 'success'
        env:
          OUTCOME: ${{ steps.live.outcome }}
        run: |
          flag=""
          if [ "$OUTCOME" = failure ]; then flag="--live-failed"; fi
          make offline ARGS="--prev-site $SITE_URL $flag"
          echo "::warning title=site built from snapshot::live build $OUTCOME; site shows data from snapshot $(jq -r .snapshot site/api/status.json)"
      - id: source
        run: echo "source=$(jq -rs 'map(.fork + ":" + .source) | join(",")' site/api/status.json site/*/api/status.json)" >> "$GITHUB_OUTPUT"
      - run: make check
      - env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: .venv/bin/python -m eipproof.smoke site "$SHA"
      - if: steps.live.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.live.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(jq -s 'map(.live_failures) | max' site/api/status.json site/*/api/status.json)
          fell=$(jq -rs 'map(select(.source == "snapshot") | "\(.fork) from snapshot \(.snapshot)") | join("; ")' site/api/status.json site/*/api/status.json)
          if [ -n "$fell" ]; then OUTCOME=failure; fi
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$FALLBACK_ISSUE\"" --json number,title \
            -q ".[] | select(.title == env.FALLBACK_ISSUE) | .number" | head -1)
          if [ "$OUTCOME" = failure ] && [ "$n" -ge 3 ]; then
            body="Live build failed $n times in a row; $fell. Latest run: $RUN_URL"
            if [ -n "$num" ]; then gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "$body"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$FALLBACK_ISSUE" --body "$body"; fi
          elif [ "$OUTCOME" = success ] && [ -n "$num" ]; then
            gh issue close "$num" -R "$GITHUB_REPOSITORY" --comment "Live build is green again: $RUN_URL"
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
  smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SHA: ${{ needs.build.outputs.sha }}
          SOURCE: ${{ needs.build.outputs.source }}
        run: |
          python -m eipproof.smoke "$PAGE_URL" "$SHA"
          echo "deployed $SHA source=$SOURCE" >> "$GITHUB_STEP_SUMMARY"
