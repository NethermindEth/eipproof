name: pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_fallback:
        description: Skip the live build and deploy from the committed snapshot
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://nethermindeth.github.io/eipproof
  DATA_BRANCH: data
  FALLBACK_ISSUE: "pages: live build falls back to snapshot"

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      source: ${{ steps.source.outputs.source }}
      archived: ${{ steps.archived.outputs.archived }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: sha
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -n "$CI_SHA" ] && [ "$CI_SHA" != "$head" ]; then
            echo "::error::main moved from $CI_SHA to $head; the ci run for $head deploys it"
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"
      - run: make test
      - run: |
          mkdir data
          git -C data init -q
          if git -C data fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/heads/$DATA_BRANCH"; then
            git -C data checkout -q FETCH_HEAD
          fi
          python3 -m eipproof.traffic check data
      - id: live
        if: ${{ !inputs.force_fallback }}
        continue-on-error: true
        run: make build ARGS="--prev-site $SITE_URL --fallback --data data"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.live.outcome != 'success'
        env:
          OUTCOME: ${{ steps.live.outcome }}
        run: |
          flag=""
          if [ "$OUTCOME" = failure ]; then flag="--live-failed"; fi
          git -C data clean -qfdx
          make offline ARGS="--prev-site $SITE_URL --data data $flag"
          echo "::warning title=site built from snapshot::live build $OUTCOME; site shows data from snapshot $(jq -r .snapshot site/api/status.json)"
      - id: source
        run: echo "source=$(jq -rs 'map(.fork + ":" + .source) | join(",")' site/api/status.json site/*/api/status.json)" >> "$GITHUB_OUTPUT"
      - id: archived
        run: |
          new=$(git -C data ls-files --others --exclude-standard)
          echo "archived=$([ -n "$new" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          mkdir -p data-new
          for f in $new; do install -D "data/$f" "data-new/$f"; done
      - if: steps.archived.outputs.archived == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-new
          path: data-new
          retention-days: 1
      - run: make check
      - env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: .venv/bin/python -m eipproof.smoke site "$SHA"
      - if: steps.live.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.live.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(jq -s 'map(.live_failures) | max' site/api/status.json site/*/api/status.json)
          fell=$(jq -rs 'map(select(.source == "snapshot") | "\(.fork) from snapshot \(.snapshot)") | join("; ")' site/api/status.json site/*/api/status.json)
          if [ -n "$fell" ]; then OUTCOME=failure; fi
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$FALLBACK_ISSUE\"" --json number,title \
            -q ".[] | select(.title == env.FALLBACK_ISSUE) | .number" | head -1)
          if [ "$OUTCOME" = failure ] && [ "$n" -ge 3 ]; then
            body="Live build failed $n times in a row; $fell. Latest run: $RUN_URL"
            if [ -n "$num" ]; then gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "$body"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$FALLBACK_ISSUE" --body "$body"; fi
          elif [ "$OUTCOME" = success ] && [ -n "$num" ]; then
            gh issue close "$num" -R "$GITHUB_REPOSITORY" --comment "Live build is green again: $RUN_URL"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SHA: ${{ needs.build.outputs.sha }}
          SOURCE: ${{ needs.build.outputs.source }}
        run: |
          python -m eipproof.smoke "$PAGE_URL" "$SHA"
          echo "deployed $SHA source=$SOURCE" >> "$GITHUB_STEP_SUMMARY"
  archive:
    needs: [build, deploy]
    if: needs.build.outputs.archived == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - run: |
          if git fetch -q --depth=1 origin "refs/heads/$DATA_BRANCH"; then
            git checkout -q -B "$DATA_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$DATA_BRANCH"
            git rm -rqf .
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data-new
          path: .
      - env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          git add snapshots
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "snapshots from $SHA" -m "$(git diff --cached --name-only -- '*.json')"
          c=$(git rev-parse HEAD)
          for i in 1 2 3; do
            if git push -q origin "HEAD:refs/heads/$DATA_BRANCH"; then break; fi
            if [ "$i" = 3 ]; then exit 1; fi
            git fetch -q --depth=1 origin "refs/heads/$DATA_BRANCH"
            git reset -q --hard FETCH_HEAD
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" cherry-pick "$c"
          done
          echo "archived to $DATA_BRANCH: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
