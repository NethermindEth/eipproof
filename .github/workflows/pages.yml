name: pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_fallback:
        description: Skip the live build and deploy from the committed snapshot
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://nethermindeth.github.io/eipproof
  FALLBACK_ISSUE: "pages: live build falls back to snapshot"

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: make test
      - id: live
        if: ${{ !inputs.force_fallback }}
        continue-on-error: true
        run: make build
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.live.outcome != 'success'
        run: |
          make offline ARGS="--prev-status $SITE_URL/api/status.json ${{ steps.live.outcome == 'failure' && '--live-failed' || '' }}"
          echo "::warning title=site built from snapshot::live build ${{ steps.live.outcome }}; site shows data from snapshot $(jq -r .snapshot site/api/status.json)"
      - id: source
        run: echo "source=$(jq -r .source site/api/status.json)" >> "$GITHUB_OUTPUT"
      - run: make check
      - run: .venv/bin/python -m eipproof.smoke site "${{ steps.sha.outputs.sha }}"
      - if: steps.live.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.live.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(jq .live_failures site/api/status.json)
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$FALLBACK_ISSUE\"" --json number,title \
            -q ".[] | select(.title == env.FALLBACK_ISSUE) | .number" | head -1)
          if [ "$OUTCOME" = failure ] && [ "$n" -ge 3 ]; then
            body="Live build failed $n times in a row; the site is built from snapshot $(jq -r .snapshot site/api/status.json). Latest run: $RUN_URL"
            if [ -n "$num" ]; then gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "$body"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$FALLBACK_ISSUE" --body "$body"; fi
          elif [ "$OUTCOME" = success ] && [ -n "$num" ]; then
            gh issue close "$num" -R "$GITHUB_REPOSITORY" --comment "Live build is green again: $RUN_URL"
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
  smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m eipproof.smoke "${{ needs.deploy.outputs.page_url }}" "${{ needs.build.outputs.sha }}"
      - run: echo "deployed ${{ needs.build.outputs.sha }} source=${{ needs.build.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"
