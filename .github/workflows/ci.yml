name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: make test
      - run: make offline
      - run: test -f site/index.html && test -f site/eip-7906.html && test -f site/client-nethermind.html && test -f site/api/eip/7906.json
